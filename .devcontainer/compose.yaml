name: prog1784f26

services:
  python:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: ["/home/vscode/.venv/bin/python", "/workspaces/PROG1784-F26/.devcontainer/tutor_gateway.py"]
    user: vscode
    init: true
    volumes:
      - ..:/workspaces/PROG1784-F26:z
    environment:
      OLLAMA_HOST: http://ollama:11434
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: docker.io/ollama/ollama:0.33.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  ollama-models:
    name: prog1784-f26_ollama-models
